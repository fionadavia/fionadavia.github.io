<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Taxly - Community Forum</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#FFF8F1] text-[#33312E] font-sans">

  <!-- Header -->
  <header class="flex justify-between items-center p-6">
    <div class="text-2xl font-bold text-[#E76F51]">Taxly</div>
    <nav class="space-x-6">
      <a href="index.html" class="hover:text-[#F4A261]">Home</a>
      <a href="features.html" class="hover:text-[#F4A261] font-semibold">Features</a>
      <a href="pricing.html" class="hover:text-[#F4A261]">Pricing</a>
      <a href="contact.html" class="hover:text-[#F4A261]">Contact</a>
    </nav>
  </header>

  <!-- Forum Section -->
  <section class="max-w-3xl mx-auto px-6 py-16">
    <h1 class="text-4xl font-bold text-center mb-8">Community Forum</h1>
    <p class="text-center text-lg mb-10">Ask questions, share advice, and connect with fellow freelancers.</p>

    <!-- Post Form -->
    <div class="bg-white rounded-xl p-6 shadow mb-10">
      <textarea id="postInput" rows="4" class="w-full p-4 border rounded-lg focus:outline-none focus:ring-2 focus:ring-[#F4A261]" placeholder="What's on your mind?"></textarea>
      <button onclick="submitPost()" class="mt-4 bg-[#F4A261] text-white px-6 py-2 rounded-full hover:bg-[#E76F51]">Post</button>
    </div>

    <!-- Post List -->
    <div id="postList" class="space-y-6">
      <!-- New posts will appear here -->
    </div>
  </section>

  <!-- Footer -->
  <footer class="text-center py-8 text-sm text-gray-600">
    <p>&copy; 2025 Taxly. All rights reserved.</p>
  </footer>

  <!-- JavaScript -->
  <script>
    function submitPost() {
      const input = document.getElementById('postInput');
      const content = input.value.trim();
      if (content) {
        const postList = document.getElementById('postList');
        const post = document.createElement('div');
        post.className = 'bg-white p-4 rounded-lg shadow';
        post.innerHTML = \`<p class=\"mb-2\">\${content}</p><span class=\"text-sm text-gray-500\">Just now</span>\`;
        postList.prepend(post);
        input.value = '';
      }
    }
  </script>

</body>
</html>
