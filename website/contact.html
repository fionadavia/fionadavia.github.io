<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taxly - Contact</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#FFF8F1] text-[#33312E] font-sans">

  <!-- Header -->
  <header class="flex justify-between items-center p-6">
    <div class="text-2xl font-bold text-[#E76F51]">Taxly</div>
    <nav class="space-x-6">
        <a href="index.html" class="hover:text-[#F4A261]">Home</a>
        <a href="features.html" class="hover:text-[#F4A261]">Features</a>
        <a href="pricing.html" class="hover:text-[#F4A261]">Pricing</a>
        <a href="contact.html" class="hover:text-[#F4A261] font-semibold">Contact</a>
      </nav>      
  </header>

  <!-- Contact Section -->
  <section class="text-center py-20 px-6">
    <h1 class="text-4xl md:text-6xl font-bold mb-10">Get in Touch</h1>
    <p class="max-w-xl mx-auto text-lg mb-12">Questions? Interested in partnerships or sponsorships? We'd love to hear from you!</p>

    <form class="max-w-2xl mx-auto space-y-6">
      <div>
        <input type="text" placeholder="Your Name" class="w-full p-4 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-[#F4A261]">
      </div>
      <div>
        <input type="email" placeholder="Your Email" class="w-full p-4 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-[#F4A261]">
      </div>
      <div>
        <textarea placeholder="Your Message" rows="5" class="w-full p-4 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-[#F4A261]"></textarea>
      </div>
      <button type="submit" class="bg-[#F4A261] text-white px-8 py-4 rounded-full text-lg hover:bg-[#E76F51]">Send Message</button>
    </form>
  </section>

  <!-- Footer -->
  <footer class="text-center py-8 text-sm text-gray-600">
    <p>&copy; 2025 Taxly. All rights reserved.</p>
  </footer>

</body>
</html>
